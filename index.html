<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHASHI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* --- VARIABLES --- */
        :root {
            --bg: #050505;          /* Almost Black */
            --fg: #ffffff;          /* Pure White */
            --grey: #888888;        /* Mid Grey */
            --border: #333333;      /* Subtle border */
            --alert: #ff3333;       /* Contact Red */
            --acid: #ffeb3b;        /* "NOTHING" YELLOW */
            
            --font-head: 'Space Grotesk', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        /* --- RESET --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-mono);
            overflow-x: hidden; 
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        img { display: block; max-width: 100%; }

        /* --- LAYOUT UTILITY --- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ============================
           NAVBAR STYLES 
           ============================ */
        header {
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            position: relative; 
            z-index: 100;
        }

        .navbar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { 
            font-weight: 700; font-size: 1.2rem; letter-spacing: -1px; color: var(--fg);
            z-index: 10; padding: 5px 10px; margin-left: -10px; border-radius: 2px; transition: all 0.2s ease;
        }
        .logo:hover {
            background-color: var(--acid); color: var(--bg); box-shadow: 0 0 15px rgba(255, 235, 59, 0.4);
        }

        .nav-links { display: flex; align-items: center; }
        .nav-links a { 
            margin-left: 10px; font-size: 0.9rem; color: var(--grey); 
            padding: 8px 16px; border: 1px solid transparent; transition: all 0.2s ease;
        }
        .nav-links a:not(.cta-alert):hover { color: var(--bg); background: var(--fg); border-color: var(--fg); }
        .nav-links a.cta-alert:hover { background-color: var(--acid); color: var(--bg); border-color: var(--acid); box-shadow: 0 0 10px rgba(255, 235, 59, 0.4); }

        /* Mobile Nav Logic (Hamburger) */
        #nav-toggle { display: none; }
        .hamburger { display: none; cursor: pointer; z-index: 10; }
        .hamburger-line { display: block; width: 25px; height: 2px; margin: 5px auto; background-color: var(--fg); transition: 0.3s; }

        @media (max-width: 768px) {
            .hamburger { display: block; } 
            .nav-links {
                position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg);
                flex-direction: column; align-items: center; border-bottom: 1px solid var(--border);
                max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out;
            }
            .nav-links a { margin: 0; width: 100%; text-align: center; padding: 20px 0; border-bottom: 1px solid #111; }
            #nav-toggle:checked ~ .nav-links { max-height: 500px; border-bottom: 1px solid var(--border); }
            
            /* Burger Animation */
            #nav-toggle:checked ~ .hamburger .line-1 { transform: rotate(45deg) translate(5px, 5px); }
            #nav-toggle:checked ~ .hamburger .line-2 { opacity: 0; }
            #nav-toggle:checked ~ .hamburger .line-3 { transform: rotate(-45deg) translate(5px, -5px); }
        }

        /* ============================
           HERO SECTION STYLES
           ============================ */
        .hero {
            padding: 80px 0;
            border-bottom: 1px solid var(--border);
            min-height: 80vh; 
            display: flex;
            align-items: center;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr; /* Text wider than image */
            gap: 60px;
            align-items: center;
            width: 100%;
        }

        /* --- TEXT ELEMENTS --- */
        .status-badge {
            display: inline-block; font-size: 0.75rem; color: var(--acid);
            border: 1px solid var(--acid); padding: 5px 10px; margin-bottom: 30px;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .status-dot {
            display: inline-block; width: 8px; height: 8px; background: var(--acid);
            border-radius: 50%; margin-right: 8px; animation: blink 2s infinite;
        }

        /* The New Larger Greeting */
        .greeting {
            font-family: var(--font-mono);
            font-size: 1.6rem; 
            color: var(--grey);
            margin-bottom: 20px;
            display: block;
            letter-spacing: -0.5px;
        }
        
        /* The Highlight Effect */
        .greeting strong { 
            color: var(--bg);
            background: var(--acid);
            padding: 2px 8px;
            font-weight: 700;
        }

        h1 {
            font-family: var(--font-head); font-size: 4.5rem; line-height: 0.95;
            font-weight: 500; letter-spacing: -2px; margin-bottom: 30px; text-transform: uppercase;
        }
        
        .hero-intro {
            color: var(--grey); font-size: 1.1rem; max-width: 450px;
            line-height: 1.6; margin-bottom: 40px;
        }

        /* --- BUTTONS --- */
        .btn-group { display: flex; gap: 20px; }
        
        .btn-hero {
            padding: 15px 30px; font-weight: 700; font-family: var(--font-head);
            text-transform: uppercase; letter-spacing: 1px; border: 1px solid var(--acid);
        }
        
        .btn-primary { background: var(--acid); color: var(--bg); }
        .btn-primary:hover { background: transparent; color: var(--acid); box-shadow: 0 0 15px rgba(255, 235, 59, 0.2); }

        .btn-secondary { border-color: var(--border); color: var(--fg); }
        .btn-secondary:hover { border-color: var(--fg); background: var(--fg); color: var(--bg); }

        /* ============================
           ROUND IMAGE STYLES
           ============================ */
        .hero-image-wrapper {
            position: relative;
            width: 350px;       /* Fixed size for circle */
            height: 350px;
            margin: 0 auto;     /* Centers it in its grid cell */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Outer Spinning "Radar" Ring */
        .hero-image-wrapper::before {
            content: "";
            position: absolute;
            inset: -15px; /* Makes ring larger than image */
            border-radius: 50%;
            border: 1px dashed var(--border);
            border-top-color: var(--acid); /* Only part of it is yellow */
            animation: spin 10s linear infinite;
        }

        /* The Image Itself */
        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Prevents stretching */
            border-radius: 50%; /* Makes it round */
            filter: grayscale(100%) contrast(1.1);
            transition: 0.5s ease;
            border: 2px solid var(--bg); /* Small separation from ring */
        }

        /* Reveal color on hover */
        .hero-image-wrapper:hover .hero-img {
            filter: grayscale(0%) contrast(1);
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }


        /* ============================
           RESPONSIVE LOGIC
           ============================ */
        
        /* Tablet & Mobile (Below 900px) */
        @media (max-width: 900px) {
            .hero-grid { 
                display: flex;             /* Switch to flex column */
                flex-direction: column; 
                align-items: center;       /* Centers blocks horizontally */
                text-align: center;        /* Centers text inside blocks */
                gap: 30px;
            }

            /* --- HIDE IMAGE ON MOBILE --- */
            .hero-image-wrapper { display: none; }

            /* Ensure text container centers its children */
            .hero-text {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 100%;
            }

            .hero-intro { margin: 0 auto 40px auto; }
            .btn-group { justify-content: center; }
            h1 { font-size: 3.5rem; }
        }
        
        /* Small Phones (Below 480px) */
        @media (max-width: 480px) {
            .hero { padding: 40px 0; min-height: 60vh; }
            h1 { font-size: 2.8rem; }
            .greeting { font-size: 1.4rem; }
            
            .btn-group { flex-direction: column; width: 100%; gap: 15px; }
            .btn-hero { width: 100%; text-align: center; }
        }

    </style>
</head>
<body>

    <header>
        <div class="container navbar-content">
            <a href="#" class="logo">HOME</a>
            
            <input type="checkbox" id="nav-toggle">
            <label for="nav-toggle" class="hamburger">
                <span class="hamburger-line line-1"></span>
                <span class="hamburger-line line-2"></span>
                <span class="hamburger-line line-3"></span>
            </label>
            
            <nav class="nav-links">
                <a href="#about">ABOUT</a>
                <a href="#work">WORKS</a>
                <a href="#skills">CAPABILITIES</a>
                <a href="mailto:email@test.com" class="cta-alert">CONTACT</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container hero-grid">
            
            <div class="hero-text">
                <div class="status-badge">
                    <span class="status-dot"></span> System Online
                </div>
                
                <span class="greeting">Hello, I am <strong>Shashikant.</strong></span>

                <h1>Bridging The<br>Physical &<br>Digital.</h1>
                
                <p class="hero-intro">
                    I architect the nervous systems of the connected world. 
                    Specializing in high-efficiency firmware, scalable IoT infrastructure, 
                    and hardware that endures.
                </p>

                <div class="btn-group">
                    <a href="#work" class="btn-hero btn-primary">Selected Works</a>
                    <a href="https://github.com" target="_blank" class="btn-hero btn-secondary">GitHub Profile</a>
                </div>
            </div>

            <div class="hero-image-wrapper">
                <img src="shashi.jpeg" alt="Shashikant Portrait" class="hero-img">
            </div>

        </div>
    </section>

</body>
</html>
